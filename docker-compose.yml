services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PORT: "8000"
      FRONTEND_DIST: /app/frontend/dist
      SERVE_FRONTEND: "true"
      # Same-origin UI + API; keep 5173 so `npm run dev` still works against this backend.
      CORS_ORIGINS: "http://localhost:8000,http://localhost:5173"
    restart: unless-stopped
