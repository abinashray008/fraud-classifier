[project]
name = "fraud-classifier-backend"
version = "0.1.0"
description = "Real-time card fraud classifier: Jev (System One) decisions with an LLM investigation tier."
requires-python = ">=3.12"
dependencies = [
    # Pinned: langchain-typesafe is alpha and its API may shift between releases.
    "langchain-typesafe[experimental]==0.0.1a2",
    "langchain>=1.4,<2",
    "langchain-core>=1.6,<2",
    "fastapi>=0.120",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
]

[project.optional-dependencies]
eval = [
    "pandas>=2.2",
    "pyarrow>=16",
    "numpy>=1.26",
    "scikit-learn>=1.5",
]
openai = ["langchain-openai>=1.0"]
anthropic = ["langchain-anthropic>=1.0"]
google = ["langchain-google-genai>=3.0"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "eval"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's `Depends()` in defaults is idiomatic.
# UP035: `typing_extensions.override` keeps the 3.12 floor explicit.
ignore = ["B008", "UP035"]
